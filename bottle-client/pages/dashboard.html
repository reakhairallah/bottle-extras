<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle - Dashboard</title>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>

    <!-- own mask, distinct from the archive's #card-holes and the
         canonical #paper-holes - this card's own proportions -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <mask id="dash-card-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="280" height="380">
            <rect x="0" y="0" width="280" height="380" fill="white" />
            <circle cx="20" cy="40" r="4.5" fill="black" />
            <circle cx="20" cy="120" r="4.5" fill="black" />
            <circle cx="20" cy="200" r="4.5" fill="black" />
            <circle cx="20" cy="280" r="4.5" fill="black" />
            <circle cx="20" cy="350" r="4.5" fill="black" />
        </mask>
    </svg>

    <div class="scene">
        <div class="sun-halo"></div>
        <div class="sun-core"></div>
    </div>
    <div class="scrim"></div>

    <nav class="nav-bar compact">
        <a href="game.html" class="icon-btn" aria-label="Back to the game" title="Back to the game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 6l-6 6 6 6" />
            </svg>
        </a>
        <div class="nav-divider"></div>
        <span class="nav-title">Dashboard</span>
        <div class="nav-divider"></div>
        <button class="nav-textbtn" id="shelf-btn">Shelf</button>
        <button class="nav-textbtn" id="sealed-btn">Sealed</button>
    </nav>

    <div class="select-banner" id="select-banner">
        <span>Choose one of your bottles below to keep — forever, and only once.</span>
        <button id="select-cancel">Cancel</button>
    </div>

    <div class="page-header">
        <h1>Your Bottles</h1>
        <p id="counts">Loading…</p>
    </div>

    <main class="grid" id="grid"></main>

    <div class="popover-backdrop" id="popover-backdrop"></div>
    <div class="popover glass" id="popover">
        <div class="popover-content" id="popover-content"></div>
    </div>

    <div class="toast-stack" id="toast-stack"></div>

    <!-- shared glass confirm dialog (styles/components.css, scripts/helpers.js
         confirmDialog) - replaces the native window.confirm() for the
         keep-a-bottle confirmation -->
    <div class="backdrop" id="confirm-backdrop"></div>
    <div class="confirm-box" id="confirm-box">
        <p class="confirm-message" id="confirm-message"></p>
        <div class="confirm-actions">
            <button class="paper-link-btn" id="confirm-cancel">Cancel</button>
            <button class="paper-primary-btn" id="confirm-ok">Confirm</button>
        </div>
    </div>

    <script src="../scripts/axios.min.js"></script>
    <script src="../scripts/env.js"></script>
    <script src="../scripts/helpers.js"></script>
    <script src="../scripts/dashboard.js"></script>
</body>
</html>
