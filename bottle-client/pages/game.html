<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottle</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

    <nav class="top-bar">
        <a href="dashboard.html" class="icon-btn" id="profile-btn" aria-label="Your dashboard">👤</a>
        <h2 id="welcome-msg">Welcome</h2>
        <button class="icon-btn" id="add-btn" aria-label="Throw a bottle">✚</button>
    </nav>

    <main class="bottle-grid">
        <button class="bottle-card"></button>
        <button class="bottle-card"></button>
        <button class="bottle-card"></button>
        <button class="bottle-card"></button>
        <button class="bottle-card"></button>
        <button class="bottle-card"></button>
    </main>

    <!-- THROW MODAL -->

    <div class="modal-backdrop hidden" id="throw-modal">
        <div class="modal-box">
            <h2>Throw a bottle</h2>
            <textarea class="text-input" id="throw-textarea" maxlength="255" placeholder="Write your message..."></textarea>
            <p class="char-num"><span id="throw-char-count">0</span>/255</p>
            <div class="modal-actions">
                <button class="cancel-btn" id="cancel-btn">Cancel</button>
                <button class="submit-btn" id="throw-btn">Throw</button>
            </div>
        </div>
    </div>

    <!--DRAW MODAL-->

    <div class="modal-backdrop hidden" id="draw-modal">
        <div class="modal-box">
            <p class="bottle-content" id="bottle-content">This is the bottle's message text.</p>

            <div class="marks-list" id="marks-list">
                <p class="mark">a line someone left</p>
                <p class="mark">another line</p>
            </div>

            <textarea class="text-input" id="mark-textarea" maxlength="100" placeholder="Leave a mark..."></textarea>
            <p class="char-num"><span id="mark-char-count">0</span>/100</p>

            <div class="modal-actions">
                <button id="report-btn">⚠︎ Report</button>
                <button class="cancel-btn" id="close-bottle-btn">Close</button>
                <button class="submit-btn" id="post-mark-btn">Post</button>
            </div>
        </div>
    </div>

    <script src="../scripts/axios.min.js"></script>
    <script src="../scripts/env.js"></script>
    <script src="../scripts/helpers.js"></script>
    <script src="../scripts/app.js"></script>
</body>
</html>
